<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%">
  <defs>
    <!-- Background atmospheric glow filters -->
    <filter id="neon-cyan" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="32" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="neon-purple" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="32" result="blur1" />
      <feGaussianBlur stdDeviation="16" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="drop-heavy" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.85"/>
    </filter>

    <filter id="drop-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Metallic Bevel Gradients -->
    <linearGradient id="metal-chassis" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#4a525d"/>
      <stop offset="20%" stop-color="#2a2e36"/>
      <stop offset="45%" stop-color="#3d444f"/>
      <stop offset="70%" stop-color="#181a1f"/>
      <stop offset="90%" stop-color="#2c313a"/>
      <stop offset="100%" stop-color="#1e2127"/>
    </linearGradient>

    <linearGradient id="metal-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9aa7b8"/>
      <stop offset="25%" stop-color="#464d59"/>
      <stop offset="75%" stop-color="#1e2229"/>
      <stop offset="100%" stop-color="#6b7685"/>
    </linearGradient>

    <linearGradient id="metal-rim-inner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111317"/>
      <stop offset="50%" stop-color="#20242c"/>
      <stop offset="100%" stop-color="#0e1014"/>
    </linearGradient>

    <!-- Glass Fill Gradients -->
    <linearGradient id="cyan-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="35%" stop-color="#00e5ff" stop-opacity="0.22"/>
      <stop offset="75%" stop-color="#0b1724" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#050b12" stop-opacity="0.90"/>
    </linearGradient>

    <linearGradient id="purple-glass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.42"/>
      <stop offset="35%" stop-color="#9333ea" stop-opacity="0.20"/>
      <stop offset="75%" stop-color="#1e0b2b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0d0414" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Center Play Button Gradients -->
    <linearGradient id="play-surface" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.85"/>
      <stop offset="45%" stop-color="#a5b4fc" stop-opacity="0.60"/>
      <stop offset="85%" stop-color="#c084fc" stop-opacity="0.80"/>
      <stop offset="100%" stop-color="#e879f9" stop-opacity="0.90"/>
    </linearGradient>

    <linearGradient id="play-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#93c5fd" stop-opacity="0.80"/>
      <stop offset="80%" stop-color="#e879f9" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.90"/>
    </linearGradient>

    <!-- Inner Neon Edge Glows -->
    <linearGradient id="neon-cyan-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ffff"/>
      <stop offset="100%" stop-color="#0077b6"/>
    </linearGradient>

    <linearGradient id="neon-purple-edge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#6b21a8"/>
    </linearGradient>
  </defs>

  <!-- ==================== 1. OUTER NEON BACK-GLOWS ==================== -->
  <!-- Left Cyan Aura -->
  <path d="M 200,230 L 400,230 L 512,350 L 366,512 L 512,674 L 400,794 L 200,794 L 350,512 Z"
        fill="#00e5ff" filter="url(#neon-cyan)" opacity="0.85" />
  <path d="M 180,245 L 356,512 L 180,779 Z"
        fill="#38bdf8" filter="url(#neon-cyan)" opacity="0.95" />

  <!-- Right Purple Aura -->
  <path d="M 624,230 L 824,230 L 660,460 L 738,512 L 660,564 L 824,794 L 624,794 L 512,674 L 738,512 L 512,350 Z"
        fill="#a855f7" filter="url(#neon-purple)" opacity="0.85" />
  <path d="M 844,245 L 675,512 L 844,779 Z"
        fill="#c084fc" filter="url(#neon-purple)" opacity="0.95" />

  <!-- ==================== 2. MAIN BRUSHED METAL CHASSIS ==================== -->
  <g filter="url(#drop-heavy)">
    <!-- Left Wing Solid Frame -->
    <path d="M 200,232 
             L 410,232 
             A 12 12 0 0 1 420,238 
             L 512,354 
             L 384,512 
             L 512,670 
             L 420,786 
             A 12 12 0 0 1 410,792 
             L 200,792 
             A 16 16 0 0 1 184,776 
             L 352,512 
             L 184,248 
             A 16 16 0 0 1 200,232 Z"
          fill="url(#metal-chassis)" stroke="url(#metal-edge)" stroke-width="5" stroke-linejoin="round"/>

    <!-- Top-Right Wing Solid Frame -->
    <path d="M 614,232 
             L 824,232 
             A 16 16 0 0 1 840,248 
             L 668,484 
             A 12 12 0 0 1 656,492 
             L 532,370 
             A 10 10 0 0 1 530,360 
             L 606,236 
             A 10 10 0 0 1 614,232 Z"
          fill="url(#metal-chassis)" stroke="url(#metal-edge)" stroke-width="5" stroke-linejoin="round"/>

    <!-- Bottom-Right Wing Solid Frame -->
    <path d="M 532,654 
             L 656,532 
             A 12 12 0 0 1 668,540 
             L 840,776 
             A 16 16 0 0 1 824,792 
             L 614,792 
             A 10 10 0 0 1 606,788 
             L 530,664 
             A 10 10 0 0 1 532,654 Z"
          fill="url(#metal-chassis)" stroke="url(#metal-edge)" stroke-width="5" stroke-linejoin="round"/>

    <!-- Central Outer Arrow Notch Cradle behind Play Button -->
    <path d="M 466,392 L 734,506 A 10 10 0 0 1 734,518 L 466,632 L 454,600 L 684,512 L 454,424 Z"
          fill="#1c2028" stroke="url(#metal-edge)" stroke-width="4" stroke-linejoin="round"/>
  </g>

  <!-- ==================== 3. TRANSLUCENT GLASS INSETS ==================== -->
  <!-- Left Wing Cyan Glass Inset -->
  <g filter="url(#drop-soft)">
    <path d="M 238,266 
             L 374,266 
             L 458,372 
             L 348,512 
             L 458,652 
             L 374,758 
             L 238,758 
             L 374,512 Z"
          fill="url(#cyan-glass)" stroke="url(#neon-cyan-edge)" stroke-width="3.5" stroke-linejoin="round"/>

    <!-- Left Glass Specular Light Reflection -->
    <path d="M 242,270 L 370,270 L 452,372" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
    <path d="M 242,754 L 370,754" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Top-Right Purple Glass Inset -->
  <g filter="url(#drop-soft)">
    <path d="M 640,266 
             L 788,266 
             L 662,444 
             L 560,366 Z"
          fill="url(#purple-glass)" stroke="url(#neon-purple-edge)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Top-Right Glass Specular Highlight -->
    <path d="M 644,270 L 782,270 L 696,390" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" opacity="0.75"/>
  </g>

  <!-- Bottom-Right Purple Glass Inset -->
  <g filter="url(#drop-soft)">
    <path d="M 560,658 
             L 662,580 
             L 788,758 
             L 640,758 Z"
          fill="url(#purple-glass)" stroke="url(#neon-purple-edge)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Bottom-Right Glass Specular Highlight -->
    <path d="M 644,754 L 782,754" fill="none" stroke="#c084fc" stroke-width="2" stroke-linecap="round" opacity="0.65"/>
  </g>

  <!-- ==================== 4. 3D FROSTED PLAY BUTTON ==================== -->
  <g filter="url(#drop-heavy)">
    <!-- Play Triangle Body -->
    <path d="M 444,406 
             A 12 12 0 0 1 458,416 
             L 622,504 
             A 14 14 0 0 1 622,520 
             L 458,608 
             A 12 12 0 0 1 444,598 
             Z"
          fill="url(#play-surface)" stroke="url(#play-rim)" stroke-width="6" stroke-linejoin="round"/>

    <!-- High-Gloss 3D Glass Highlights on Play Arrow -->
    <path d="M 452,422 L 612,510" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.95"/>
    <path d="M 451,424 L 451,592" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.75"/>
  </g>
</svg>