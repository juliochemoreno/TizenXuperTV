<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 140" width="100%" height="100%">
  <defs>
    <!-- Embedded mini logo definitions -->
    <linearGradient id="h-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a525d"/>
      <stop offset="50%" stop-color="#2a2e36"/>
      <stop offset="100%" stop-color="#181a1f"/>
    </linearGradient>
    <linearGradient id="h-metal-edge" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9aa7b8"/>
      <stop offset="100%" stop-color="#3b404d"/>
    </linearGradient>
    <linearGradient id="h-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="h-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#7e22ce"/>
    </linearGradient>
    <linearGradient id="h-play" x1="0%" y1="0%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#7dd3fc"/>
      <stop offset="50%" stop-color="#a5b4fc"/>
      <stop offset="100%" stop-color="#e879f9"/>
    </linearGradient>
    <filter id="h-glow-c" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
    <filter id="h-glow-p" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- Left Emblem (scaled to fit 120x120 box at x=10, y=10) -->
  <g transform="translate(10, 10) scale(0.117)">
    <!-- Cyan glow -->
    <path d="M 180,230 L 420,230 L 512,350 L 366,512 L 512,674 L 420,794 L 180,794 L 350,512 Z" fill="#00e5ff" opacity="0.6" filter="url(#h-glow-c)"/>
    <!-- Purple glow -->
    <path d="M 624,230 L 844,230 L 660,460 L 738,512 L 660,564 L 844,794 L 624,794 L 512,674 L 738,512 L 512,350 Z" fill="#a855f7" opacity="0.6" filter="url(#h-glow-p)"/>

    <!-- Left Wing Frame -->
    <path d="M 200,232 L 410,232 A 12 12 0 0 1 420,238 L 512,354 L 384,512 L 512,670 L 420,786 A 12 12 0 0 1 410,792 L 200,792 A 16 16 0 0 1 184,776 L 352,512 L 184,248 A 16 16 0 0 1 200,232 Z"
          fill="url(#h-metal)" stroke="url(#h-metal-edge)" stroke-width="8"/>
    <!-- Top-Right Wing Frame -->
    <path d="M 614,232 L 824,232 A 16 16 0 0 1 840,248 L 668,484 A 12 12 0 0 1 656,492 L 532,370 A 10 10 0 0 1 530,360 L 606,236 A 10 10 0 0 1 614,232 Z"
          fill="url(#h-metal)" stroke="url(#h-metal-edge)" stroke-width="8"/>
    <!-- Bottom-Right Wing Frame -->
    <path d="M 532,654 L 656,532 A 12 12 0 0 1 668,540 L 840,776 A 16 16 0 0 1 824,792 L 614,792 A 10 10 0 0 1 606,788 L 530,664 A 10 10 0 0 1 532,654 Z"
          fill="url(#h-metal)" stroke="url(#h-metal-edge)" stroke-width="8"/>

    <!-- Glass Insets -->
    <path d="M 238,266 L 374,266 L 458,372 L 348,512 L 458,652 L 374,758 L 238,758 L 374,512 Z" fill="url(#h-cyan)" opacity="0.85"/>
    <path d="M 640,266 L 788,266 L 662,444 L 560,366 Z" fill="url(#h-purple)" opacity="0.85"/>
    <path d="M 560,658 L 662,580 L 788,758 L 640,758 Z" fill="url(#h-purple)" opacity="0.85"/>

    <!-- Play Arrow -->
    <path d="M 444,406 A 12 12 0 0 1 458,416 L 622,504 A 14 14 0 0 1 622,520 L 458,608 A 12 12 0 0 1 444,598 Z"
          fill="url(#h-play)" stroke="#ffffff" stroke-width="8"/>
  </g>

  <!-- Typography Lockup -->
  <g font-family="-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif" font-weight="900" font-size="54" letter-spacing="1">
    <text x="160" y="88" fill="#38bdf8">TIZEN</text>
    <text x="335" y="88" fill="#ffffff">XUPER</text>
    <text x="535" y="88" fill="#a855f7">TV</text>
  </g>
</svg>